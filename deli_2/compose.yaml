services:
  # internal/private flask app
  internal-flask:
    build: ./app
    container_name: internal-flask
    networks:
      - internal_net

  # gateway/reverse proxy container
  gateway-proxy:
    image: nginx:alpine
    container_name: gateway-proxy
    ports:
      - "8080:80" 
    networks:
      - proxy_net
      - internal_net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - internal-flask

networks:
  proxy_net:
    driver: bridge
  internal_net:
    internal: true # no external internet access

