services:
  ubuntu-server-internal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: internal-server
    command: >
      bash -c "
      ip route del default;
      ip route add default via 192.168.0.3;
      sleep infinity
      "
    cap_add:
      - NET_ADMIN
    networks:
      internal-network:
        ipv4_address: 192.168.0.2

  ubuntu-server-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-server
    command: >
      bash -c "
      sysctl -w net.ipv4.ip_forward=1;
      iptables -t nat -A POSTROUTING -o eth1 -j MASQUERADE;
      iptables -I FORWARD -i eth0 -o eth1 -j ACCEPT;
      iptables -I FORWARD -i eth1 -o eth0 -m state --state RELATED,ESTABLISHED -j ACCEPT;
      sleep infinity
      "
    cap_add:
      - NET_ADMIN
    networks:
      internal-network:
        ipv4_address: 192.168.0.3
      default:

networks:
  internal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.0.0/16

